name: android-apk
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: gradle/actions/setup-gradle@v4
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
        working-directory: mobile
      - name: Build release APK (arm64)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --stacktrace
        working-directory: mobile/android
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_BASE_URL: https://handshake-pi-amber.vercel.app
      - uses: actions/upload-artifact@v4
        with:
          name: handshake-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
