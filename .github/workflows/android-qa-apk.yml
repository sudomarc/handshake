name: Android QA APK

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-qa-apk.yml"
      - "AGENTS.md"
      - "ROADMAP.md"
      - "docs/ANDROID_FAKE_CALL_QA_2026-10-07.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Install mobile JS dependencies for native plugin tests
        run: npm install --no-audit --no-fund
        working-directory: mobile

      - name: Run test suite (TS modules + native-copy sync guard)
        run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci
        working-directory: mobile

      - name: Build release APK (arm64)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --stacktrace
        working-directory: mobile/android
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_BASE_URL: https://handshake-pi-amber.vercel.app

      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: handshake-qa-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
